[build]
  publish = "web"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The website calls /api/chat. Netlify sends that to the function.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
